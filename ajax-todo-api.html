<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    
        <h1>To Do Data</h1>
        <div class="row">
            <div class="col-4"></div>
            <div class="col-4">
                <center>
                <table class="border border-2">
                    <thead>
                        <tr class="border border-2">
                            <th >UserId</th>
                            <th>Id</th>
                            <th>Title</th>
                            <th>Completed</th>
                        </tr>
                </thead>
                <tbody id="result" class="border border-2">
                </tbody>
        </table>
        </div>
    </center>
    <div class="col-4"></div>
    </div>
</body>
<script>
    //AJAX  API CALL

    //1. Create an XMLHttpRequest object
    const response = new XMLHttpRequest();

    //connect to api call
    response.open("GET", "https://jsonplaceholder.typicode.com/todos");

    //send
    response.send()

    //setonreadystatechange
    response.onreadystatechange=()=>{
        if(response.readyState==4){
        if(response.status>199 && response.status<300){
            // console.log(response.responseText);
            const todoarray=JSON.parse(response.responseText);
            // console.log(todoarray);
            displaydata(todoarray);
        }
    }
  }
    //display array ofdata into the browser
    function displaydata(todoarray){
         for (let todo of todoarray){
            console.log(todo);
            htmldata=`<tr>
            <td>${todo.userId}</td>
            <td>${todo.id}</td>
            <td>${todo.title}</td>
            <td>${todo.completed}</td>
            </tr>`;
            document.getElementById("result").innerHTML+=htmldata;
        }

    }

</script>
</html>
